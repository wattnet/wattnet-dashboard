name: Bug Report
description: Report a bug or unexpected behavior in wattnet-dashboard.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug. Please fill in as much detail as possible to help us reproduce and fix the issue.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
      placeholder: "When I select the water footprint, the map shows no data for any zone."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal steps needed to reproduce the behavior.
      placeholder: |
        1. Open the map
        2. Select "Water" in the footprint dimension
        3. Observe that no zone has a color
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened? Add a screenshot if it helps.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: wattnet-dashboard Version
      description: The version of the image or of the release, if you know it.
      placeholder: "e.g. 1.6.1"
    validations:
      required: false

  - type: input
    id: browser
    attributes:
      label: Browser and Device
      placeholder: "e.g. Firefox 140 on Ubuntu 24.04, Safari on iPhone 15"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Console Output or Logs
      description: Errors of the browser console or of the server (redact credentials).
      render: text
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other context that might help diagnose the issue, such as the URL with its parameters.
    validations:
      required: false
