name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, type check and build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]

    steps:
      - uses: actions/checkout@v7

      # Yarn comes from the packageManager field of package.json, through Corepack, which has to be on before setup-node asks for the cache.
      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: yarn

      - name: Install the dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Type check
        run: yarn tsc --noEmit

      # The build checks the types again and generates the pages, so a route or a page that fails to build is found here.
      - name: Build
        run: yarn build

  audit:
    name: Audit the dependencies of the production build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: yarn

      - name: Install the dependencies
        run: yarn install --immutable

      # Only what ships (the development tools are left out) and only high or critical, so that a new advisory of a tool of the build does not stop the work of everybody.
      - name: Audit
        run: yarn npm audit --all --recursive --environment production --severity high

  docker:
    name: Build the image
    runs-on: ubuntu-latest
    needs: check

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # It is not pushed: this only proves that the Dockerfile builds.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
